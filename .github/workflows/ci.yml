name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly. Catches breakage from dependency drift rather than from commits —
    # Rapier and Recast have both renamed result fields between minor releases.
    - cron: '0 8 * * *'

jobs:
  audit:
    name: Static audit and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run audit
      - run: npm run build

  smoke:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    needs: audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
